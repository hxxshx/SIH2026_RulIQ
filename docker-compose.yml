version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ruliq_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ruliq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruliq_secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ruliq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruliq_user} -d ${POSTGRES_DB:-ruliq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruliq_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ruliq_user}:${POSTGRES_PASSWORD:-ruliq_secure_dev_password}@db:5432/${POSTGRES_DB:-ruliq_db}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      DEBUG: "true"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    profiles: ["full"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ruliq_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    profiles: ["full"]

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
